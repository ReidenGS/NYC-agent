services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nyc_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyc_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyc_agent_password}
      POSTGRES_DB: ${POSTGRES_DB:-nyc_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nyc_agent_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyc_agent} -d ${POSTGRES_DB:-nyc_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nyc_agent_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - nyc_agent_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  data-sync-service:
    build:
      context: ./services/data-sync-service
    container_name: nyc_agent_data_sync
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # data-sync-service is sync code (psycopg). Prefer DATABASE_URL_SYNC_DOCKER;
      # fall back to legacy DATABASE_URL_DOCKER, then to a built-in psycopg default.
      DATABASE_URL_SYNC_DOCKER: ${DATABASE_URL_SYNC_DOCKER:-postgresql+psycopg://nyc_agent:nyc_agent_password@postgres:5432/nyc_agent}
      DATABASE_URL_DOCKER: ${DATABASE_URL_DOCKER:-postgresql+psycopg://nyc_agent:nyc_agent_password@postgres:5432/nyc_agent}
      SYNC_ENABLE_SCHEDULED_JOBS: ${SYNC_ENABLE_SCHEDULED_JOBS:-false}
      SYNC_BOOTSTRAP_AREAS: ${SYNC_BOOTSTRAP_AREAS:-}
      SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
      SOCRATA_PAGE_SIZE: ${SOCRATA_PAGE_SIZE:-1000}
      SOCRATA_MAX_ROWS_PER_JOB: ${SOCRATA_MAX_ROWS_PER_JOB:-50000}
      RENTCAST_SYNC_ENABLED: ${RENTCAST_SYNC_ENABLED:-false}
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}
      HUD_USER_API_TOKEN: ${HUD_USER_API_TOKEN:-}
      RENTCAST_MAX_CALLS_PER_RUN: ${RENTCAST_MAX_CALLS_PER_RUN:-5}
      RENTCAST_MAX_CALLS_PER_MONTH: ${RENTCAST_MAX_CALLS_PER_MONTH:-50}
      OVERPASS_MAX_REQUESTS_PER_RUN: ${OVERPASS_MAX_REQUESTS_PER_RUN:-10}
      OVERPASS_SLEEP_SECONDS: ${OVERPASS_SLEEP_SECONDS:-3}
      MAP_LAYER_PREGENERATE_FOR_SEED: ${MAP_LAYER_PREGENERATE_FOR_SEED:-true}
      MTA_BUS_STATIC_FEED_URLS: ${MTA_BUS_STATIC_FEED_URLS:-}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
      EXTAPI_RATE_LIMIT_PER_MINUTE: ${EXTAPI_RATE_LIMIT_PER_MINUTE:-60}
    ports:
      - "${DATA_SYNC_PORT:-8030}:8030"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8030/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-profile:
    build:
      context: .
      dockerfile: ./services/mcp-profile/Dockerfile
    container_name: nyc_agent_mcp_profile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/shared
      PROFILE_STORE_BACKEND: ${PROFILE_STORE_BACKEND:-postgres}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC_DOCKER:-postgresql+psycopg://nyc_agent:nyc_agent_password@postgres:5432/nyc_agent}
      PROFILE_STATEMENT_TIMEOUT_MS: ${PROFILE_STATEMENT_TIMEOUT_MS:-3000}
    ports:
      - "${MCP_PROFILE_PORT:-8026}:8026"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8026/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  profile-agent:
    build:
      context: .
      dockerfile: ./services/profile-agent/Dockerfile
    container_name: nyc_agent_profile_agent
    restart: unless-stopped
    depends_on:
      mcp-profile:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/shared
      MCP_PROFILE_URL: ${MCP_PROFILE_URL_DOCKER:-http://mcp-profile:8026}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      PROFILE_AGENT_MODEL: ${PROFILE_AGENT_MODEL:-gpt-4o}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-20}
    ports:
      - "${PROFILE_AGENT_PORT:-8014}:8014"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8014/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-housing:
    build:
      context: .
      dockerfile: ./services/mcp-housing/Dockerfile
    container_name: nyc_agent_mcp_housing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/shared
      DATABASE_URL_SQL: ${DATABASE_URL_SQL_DOCKER:-postgresql+psycopg://nyc_agent:nyc_agent_password@postgres:5432/nyc_agent}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-3000}
    ports:
      - "${MCP_HOUSING_PORT:-8031}:8021"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8021/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-safety:
    build:
      context: .
      dockerfile: ./services/mcp-safety/Dockerfile
    container_name: nyc_agent_mcp_safety
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/shared
      DATABASE_URL_SQL: ${DATABASE_URL_SQL_DOCKER:-postgresql+psycopg://nyc_agent:nyc_agent_password@postgres:5432/nyc_agent}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-3000}
    ports:
      - "${MCP_SAFETY_PORT:-8024}:8024"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8024/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-amenity:
    build:
      context: .
      dockerfile: ./services/mcp-amenity/Dockerfile
    container_name: nyc_agent_mcp_amenity
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/shared
      DATABASE_URL_SQL: ${DATABASE_URL_SQL_DOCKER:-postgresql+psycopg://nyc_agent:nyc_agent_password@postgres:5432/nyc_agent}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-3000}
    ports:
      - "${MCP_AMENITY_PORT:-8028}:8028"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8028/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-entertainment:
    build:
      context: .
      dockerfile: ./services/mcp-entertainment/Dockerfile
    container_name: nyc_agent_mcp_entertainment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/shared
      DATABASE_URL_SQL: ${DATABASE_URL_SQL_DOCKER:-postgresql+psycopg://nyc_agent:nyc_agent_password@postgres:5432/nyc_agent}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-3000}
    ports:
      - "${MCP_ENTERTAINMENT_PORT:-8029}:8029"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8029/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  nl-to-sql-agent:
    build:
      context: .
      dockerfile: ./services/nl-to-sql-agent/Dockerfile
    container_name: nyc_agent_nl_to_sql_agent
    restart: unless-stopped
    depends_on:
      mcp-amenity:
        condition: service_healthy
      mcp-entertainment:
        condition: service_healthy
      mcp-housing:
        condition: service_healthy
      mcp-safety:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/shared
      MCP_AMENITY_URL: ${MCP_AMENITY_URL_DOCKER:-http://mcp-amenity:8028}
      MCP_ENTERTAINMENT_URL: ${MCP_ENTERTAINMENT_URL_DOCKER:-http://mcp-entertainment:8029}
      MCP_HOUSING_URL: ${MCP_HOUSING_URL_DOCKER:-http://mcp-housing:8021}
      MCP_SAFETY_URL: ${MCP_SAFETY_URL_DOCKER:-http://mcp-safety:8024}
      NL_TO_SQL_SKILL_ROOT: ${NL_TO_SQL_SKILL_ROOT_DOCKER:-/app/skills/nyc-nl-to-sql}
      USE_LLM_SQL_PLANNER: ${USE_LLM_SQL_PLANNER:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      NL_TO_SQL_AGENT_MODEL: ${NL_TO_SQL_AGENT_MODEL:-gpt-4o}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-20}
    ports:
      - "${NL_TO_SQL_AGENT_PORT:-8016}:8016"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8016/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-transit:
    build:
      context: .
      dockerfile: ./services/mcp-transit/Dockerfile
    container_name: nyc_agent_mcp_transit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/shared
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC_DOCKER:-postgresql+psycopg://nyc_agent:nyc_agent_password@postgres:5432/nyc_agent}
      TRANSIT_STATEMENT_TIMEOUT_MS: ${TRANSIT_STATEMENT_TIMEOUT_MS:-3000}
      TRANSIT_REALTIME_ENABLED: ${TRANSIT_REALTIME_ENABLED:-true}
      TRANSIT_REALTIME_TTL_SECONDS: ${TRANSIT_REALTIME_TTL_SECONDS:-60}
      TRANSIT_REALTIME_REQUEST_TIMEOUT_SECONDS: ${TRANSIT_REALTIME_REQUEST_TIMEOUT_SECONDS:-5}
      MTA_API_KEY: ${MTA_API_KEY:-}
      MTA_BUS_TIME_API_KEY: ${MTA_BUS_TIME_API_KEY:-}
      MTA_SUBWAY_FEED_BASE_URL: ${MTA_SUBWAY_FEED_BASE_URL:-https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2F}
      MTA_BUS_GTFS_RT_TRIP_UPDATES_URL: ${MTA_BUS_GTFS_RT_TRIP_UPDATES_URL:-https://gtfsrt.prod.obanyc.com/tripUpdates}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
    ports:
      - "${MCP_TRANSIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8025/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  transit-agent:
    build:
      context: .
      dockerfile: ./services/transit-agent/Dockerfile
    container_name: nyc_agent_transit_agent
    restart: unless-stopped
    depends_on:
      mcp-transit:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/shared
      MCP_TRANSIT_URL: ${MCP_TRANSIT_URL_DOCKER:-http://mcp-transit:8025}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      TRANSIT_AGENT_MODEL: ${TRANSIT_AGENT_MODEL:-gpt-4o}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-20}
      # transit endpoint RAG: corpus is loaded once at startup from postgres
      DATABASE_URL_SQL: ${DATABASE_URL_SQL_DOCKER:-postgresql+psycopg://nyc_agent:nyc_agent_password@postgres:5432/nyc_agent}
      TRANSIT_RAG_EMBEDDING_MODEL: ${TRANSIT_RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      TRANSIT_RAG_TOP_K: ${TRANSIT_RAG_TOP_K:-5}
      TRANSIT_RAG_MIN_SIMILARITY: ${TRANSIT_RAG_MIN_SIMILARITY:-0.78}
      TRANSIT_RAG_MIN_MARGIN: ${TRANSIT_RAG_MIN_MARGIN:-0.04}
    ports:
      - "${TRANSIT_AGENT_PORT:-8013}:8013"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8013/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-weather:
    build:
      context: .
      dockerfile: ./services/mcp-weather/Dockerfile
    container_name: nyc_agent_mcp_weather
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/shared
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC_DOCKER:-postgresql+psycopg://nyc_agent:nyc_agent_password@postgres:5432/nyc_agent}
      WEATHER_STATEMENT_TIMEOUT_MS: ${WEATHER_STATEMENT_TIMEOUT_MS:-3000}
      NWS_USER_AGENT: ${NWS_USER_AGENT:-NYC-agent-demo/0.1 (contact@example.com)}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
    ports:
      - "${MCP_WEATHER_PORT:-8027}:8027"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8027/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  weather-agent:
    build:
      context: .
      dockerfile: ./services/weather-agent/Dockerfile
    container_name: nyc_agent_weather_agent
    restart: unless-stopped
    depends_on:
      mcp-weather:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/shared
      MCP_WEATHER_URL: ${MCP_WEATHER_URL_DOCKER:-http://mcp-weather:8027}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      WEATHER_AGENT_MODEL: ${WEATHER_AGENT_MODEL:-gpt-4o}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-20}
    ports:
      - "${WEATHER_AGENT_PORT:-8015}:8015"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8015/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator-agent:
    # LangGraph 6-node orchestrator (cut 9: replaced the v1 if/elif version).
    # Old v1 code lives in git history if rollback is ever needed.
    build:
      context: .
      dockerfile: ./services/orchestrator-agent/Dockerfile
    container_name: nyc_agent_orchestrator_agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      profile-agent:
        condition: service_healthy
      nl-to-sql-agent:
        condition: service_healthy
      weather-agent:
        condition: service_healthy
      transit-agent:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/shared
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ORCHESTRATOR_UNDERSTAND_MODEL: ${ORCHESTRATOR_UNDERSTAND_MODEL:-gpt-4o-mini}
      ORCHESTRATOR_RESPOND_MODEL: ${ORCHESTRATOR_RESPOND_MODEL:-gpt-4o-mini}
      DATABASE_URL_ASYNC: ${DATABASE_URL_ASYNC_DOCKER:-postgresql://nyc_agent:nyc_agent_password@postgres:5432/nyc_agent}
      PROFILE_AGENT_URL: ${PROFILE_AGENT_URL_DOCKER:-http://profile-agent:8014}
      NL_TO_SQL_AGENT_URL: ${NL_TO_SQL_AGENT_URL_DOCKER:-http://nl-to-sql-agent:8016}
      TRANSIT_AGENT_URL: ${TRANSIT_AGENT_URL_DOCKER:-http://transit-agent:8013}
      WEATHER_AGENT_URL: ${WEATHER_AGENT_URL_DOCKER:-http://weather-agent:8015}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-nyc-agent}
    ports:
      - "${ORCHESTRATOR_AGENT_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: nyc_agent_api_gateway
    restart: unless-stopped
    depends_on:
      data-sync-service:
        condition: service_healthy
      orchestrator-agent:
        condition: service_healthy
      mcp-weather:
        condition: service_healthy
      mcp-transit:
        condition: service_healthy
    environment:
      USE_REMOTE_ORCHESTRATOR: ${USE_REMOTE_ORCHESTRATOR:-true}
      ALLOW_MOCK_FALLBACK: ${ALLOW_MOCK_FALLBACK:-false}
      ORCHESTRATOR_AGENT_URL: ${ORCHESTRATOR_AGENT_URL_DOCKER:-http://orchestrator-agent:8010}
      DATA_SYNC_BASE_URL: ${DATA_SYNC_BASE_URL_DOCKER:-http://data-sync-service:8030}
      MCP_WEATHER_URL: ${MCP_WEATHER_URL_DOCKER:-http://mcp-weather:8027}
      MCP_TRANSIT_URL: ${MCP_TRANSIT_URL_DOCKER:-http://mcp-transit:8025}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-30}
      CORS_ORIGINS: ${API_GATEWAY_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nyc_agent_pgdata:
    external: true
    name: nyc-agent-claude_nyc_agent_pgdata
  nyc_agent_redisdata:
    external: true
    name: nyc-agent-claude_nyc_agent_redisdata
